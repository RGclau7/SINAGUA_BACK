# Entorno de desarrollo del backend de SINAGUA.
# Las credenciales se leen de backend/.env (copiado de .env.example, no se versiona).
name: sinagua

services:
  # La API lee backend/.env desde el volumen (no se inyecta como entorno, así
  # `php artisan test` puede usar SQLite según phpunit.xml).
  api:
    build: .
    volumes:
      - ./:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  # Worker de la cola "database": trabajos en segundo plano (por ejemplo, verificar la bitácora).
  # Se reinicia solo tras 500 trabajos, 1 hora o 128 MB: así una fuga de memoria nunca se acumula.
  queue:
    build: .
    volumes:
      - ./:/var/www/html
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-jobs=500", "--max-time=3600", "--memory=128", "--sleep=3"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      # Superusuario solo para administración; la API usa DB_USERNAME (sin privilegios, sujeto a RLS).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD}
      APP_DB_USER: ${DB_USERNAME}
      APP_DB_PASSWORD: ${DB_PASSWORD}
      APP_DB_NAME: ${DB_DATABASE}
    ports:
      - "${DB_FORWARD_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # La imagen oficial minio/minio dejó de publicarse en Docker Hub; se usa la de Chainguard.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "${MINIO_FORWARD_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data

  # Crea el bucket de comprobantes la primera vez y termina (reintenta hasta que MinIO responda).
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}@minio:9000
    command: ["mb", "--ignore-existing", "local/${AWS_BUCKET}"]
    restart: on-failure

  # Correo de prueba: los correos (PIN de activación, código de entrada) no salen a internet;
  # se ven en http://localhost:8025. No necesita cuenta ni contraseña.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

volumes:
  pgdata:
  miniodata:
