                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Cargo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Cuotas y multas]
      summary: Multar a una o varias familias
      operationId: createMulta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [familia_ids, description, amount_cents, year, month]
              properties:
                familia_ids: { type: array, minItems: 1, maxItems: 500, items: { type: string, format: uuid } }
                description: { type: string, minLength: 3, maxLength: 190, example: No asistió a la faena }
                amount_cents: { type: integer, minimum: 1, example: 10000 }
                year: { type: integer }
                month: { type: integer }
      responses:
        '201':
          description: Multas creadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
