    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Ingresos y gastos]
      summary: Subir comprobante (foto o PDF)
      description: Se guarda en MinIO/S3 con su huella SHA-256.
      operationId: uploadComprobante
      parameters:
        - { name: X-Device-Id, in: header, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo: { type: string, format: binary }
      responses:
        '200':
          description: Comprobante guardado.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Gasto' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Ingresos y gastos]
      summary: Descargar comprobante
      operationId: downloadComprobante
      responses:
        '200':
          description: Archivo (se envía por flujo, sin cargarlo completo en memoria).
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

