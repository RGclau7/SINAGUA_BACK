            paquete_id: { type: [string, 'null'] }
            label: { type: string }
            familias_activas: { type: integer }
    Familia:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          properties:
            vivienda_id: { type: string, format: uuid }
            name: { type: string }
            head_id: { type: [string, 'null'], format: uuid }
            cuota_especial_cents: { type: [integer, 'null'] }
    Habitante:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          properties:
            familia_id: { type: string, format: uuid }
            name: { type: string }
