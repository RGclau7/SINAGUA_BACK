      summary: Categorías de ingresos con su saldo
      operationId: listCategorias
      responses:
        '200':
          description: Categorías.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Categoria' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Ingresos y gastos]
      summary: Crear categoría (fondo)
      operationId: createCategoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: Baños comunitarios }
