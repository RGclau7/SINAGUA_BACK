    get:
      tags: [Ingresos y gastos]
      summary: Ingresos extras
      operationId: listIngresos
      parameters:
        - { name: categoria_id, in: query, schema: { type: string, format: uuid } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Ingresos, el más reciente primero (máximo 500).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Ingreso' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Ingresos y gastos]
      summary: Registrar ingreso
      operationId: createIngreso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoria_id, amount_cents, received_on]
              properties:
                categoria_id: { type: string, format: uuid }
                amount_cents: { type: integer, minimum: 1, example: 5000 }
                received_on: { type: string, format: date, example: '2026-11-08' }
                note: { type: [string, 'null'], maxLength: 255 }
      responses:
        '201':
          description: Ingreso registrado.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Ingreso' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

