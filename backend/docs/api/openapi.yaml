        '200':
          description: Página de periodos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Periodo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /periodos/generar:
    post:
      tags: [Cuotas y multas]
      summary: Asignar la cuota del mes y generar sus cargos
      description: Idempotente; responde `201` si creó cargos y `200` si ya estaban.
      operationId: generatePeriodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, month]
              properties:
                year: { type: integer, example: 2026 }
                month: { type: integer, minimum: 1, maximum: 12, example: 11 }
                amount_cents: { type: [integer, 'null'], example: 15000 }
      responses:
        '200':
          description: Ya estaban generados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WithNotices' }
        '201':
          description: Cargos generados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WithNotices' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

