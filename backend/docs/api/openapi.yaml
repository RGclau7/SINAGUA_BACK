        reference: { type: [string, 'null'], maxLength: 190 }
        paquete_id: { type: [string, 'null'], example: p1 }
    FamiliaInput:
      type: object
      properties:
        vivienda_id: { type: string, format: uuid }
        name: { type: string }
        head_id: { type: [string, 'null'], format: uuid }
        cuota_especial_cents: { type: [integer, 'null'] }
    HabitanteInput:
      type: object
      properties:
        familia_id: { type: string, format: uuid }
        given_names: { type: string }
        paternal_surname: { type: string }
        maternal_surname: { type: [string, 'null'] }
        phone: { type: [string, 'null'], pattern: '^\d{10}$' }
    Paquete:
      type: object
      properties:
        id: { type: string, example: p1 }
        name: { type: string, example: Paquete 1 }
        familias: { type: integer }
        cuota_cents: { type: [integer, 'null'] }
        activo: { type: boolean }
    Ajustes:
      type: object
