      tags: [Entregas y cortes]
      summary: Lo que cada cobrador tiene por entregar
      operationId: listCortes
      responses:
        '200':
          description: Cortes (el cobrador solo ve el suyo).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Corte' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /cortes/{cobradorId}:
    get:
      tags: [Entregas y cortes]
      summary: Recibos por entregar de un cobrador
      operationId: showCorte
      parameters:
        - { name: cobradorId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Recibos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        folio: { type: string }
                        familia: { type: string }
                        total_cents: { type: integer }
                        paid_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /entregas:
    get:
      tags: [Entregas y cortes]
      summary: Entregas registradas
      operationId: listEntregas
      responses:
        '200':
          description: Entregas (máximo 500).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Entrega' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Entregas y cortes]
      summary: Registrar que se recibió el dinero de unos recibos
      description: Requiere `dinero.confirmar`. Los recibos se toman con `FOR UPDATE` para que no se entreguen dos veces.
      operationId: createEntrega
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cobrador_id, pago_ids, received_cents]
              properties:
                cobrador_id: { type: string, format: uuid }
                pago_ids: { type: array, items: { type: string, format: uuid } }
                received_cents: { type: integer, minimum: 0 }
                note: { type: [string, 'null'] }
                received_at: { type: [string, 'null'], format: date-time }
      responses:
        '201':
          description: Entrega registrada (avisa si falta o sobra dinero).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WithNotices' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /roles:
    get:
      tags: [Usuarios]
      summary: Roles asignables y su matriz de permisos
      operationId: listRoles
      responses:
        '200':
          description: Roles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string, example: cobrador }
                        permissions: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users:
    get:
      tags: [Usuarios]
      summary: Usuarios de la comunidad
      operationId: listUsers
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Página de usuarios.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Usuarios]
      summary: Crear usuario
      description: La contraseña (mínimo 10 caracteres) se guarda con bcrypt; nunca se devuelve.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '201':
          description: Usuario creado.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Usuarios]
      summary: Detalle de usuario
      operationId: showUser
      responses:
        '200':
          description: Usuario.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Usuarios]
      summary: Editar usuario
      description: Si cambia la contraseña, se revocan todas sus sesiones JWT.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '200':
          description: Usuario actualizado.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{id}/activate:
    post:
      tags: [Usuarios]
      summary: Activar usuario
      operationId: activateUser
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Usuario activo.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{id}/deactivate:
    post:
      tags: [Usuarios]
      summary: Desactivar usuario (revoca sus sesiones)
      operationId: deactivateUser
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Usuario desactivado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WithNotices' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/communities:
    get:
      tags: [Superadministrador]
      summary: Comunidades
      operationId: listCommunities
      responses:
        '200':
          description: Comunidades.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Community' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Superadministrador]
      summary: Alta de comunidad con su primer administrador
      operationId: createCommunity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, state, municipality, locality, contact_phone, admin]
              properties:
                name: { type: string, maxLength: 160 }
                state: { type: string }
                municipality: { type: string }
                locality: { type: string }
                contact_phone: { type: string, pattern: '^\d{10}$' }
                contact_email: { type: [string, 'null'], format: email }
                admin: { $ref: '#/components/schemas/UserInput' }
      responses:
        '201':
          description: Comunidad creada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Community'
                      - type: object
                        properties:
                          admin: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /autorizaciones:
    get:
      tags: [Gastos]
      summary: Autorizaciones de gastos del cobrador (últimos 30 días), tope y cobradores
      operationId: listAutorizaciones
      responses:
        '200': { description: '`{ tope_egreso_cents, cobradores[], autorizaciones[] }` (estado vigente, usada, vencida).' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Gastos]
      summary: Generar un código para un gasto del cobrador que pasa el tope
      description: |
        Solo el administrador. Devuelve `codigo` (6 números) una sola vez: se dicta por teléfono o se manda por
        WhatsApp al cobrador. Vence en 30 minutos (AUTORIZACION_MINUTES), sirve una vez, solo para ese cobrador
        y hasta `max_amount_cents`.
      operationId: createAutorizacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cobrador_id, max_amount_cents]
              properties:
                cobrador_id: { type: string, format: uuid }
                max_amount_cents: { type: integer, minimum: 1 }
                motivo: { type: [string, 'null'], maxLength: 160 }
      responses:
        '201': { description: 'Autorización con su código.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /autorizaciones/canjear:
    post:
      tags: [Gastos]
      summary: El cobrador canjea el código para un gasto que pasa el tope
      description: |
        Antes de guardar el gasto en el equipo (con internet). Queda ligado a `gasto_id`; el gasto se manda después
        por /sync/push con `autorizacion_id`. Errores `autorizacion_invalida` (422), `autorizacion_monto` (422),
        `autorizacion_vencida` (410) y, tras 5 intentos fallidos, `pin_locked` (423).
      operationId: redeemAutorizacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, gasto_id, amount_cents]
              properties:
                codigo: { type: string }
                gasto_id: { type: string, format: uuid }
                amount_cents: { type: integer, minimum: 1 }
      responses:
        '200': { description: 'Autorización usada (con quién la autorizó).' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410': { description: 'Código vencido.' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '423': { description: 'Demasiados códigos incorrectos.' }
  /activation:
    post:
      tags: [Autenticación]
      summary: Activar una cuenta dada de alta por correo (PIN + contraseña + foto)
      description: |
        Primer acceso. El PIN (6 números) vence en 24–48 h, sirve una vez y se anula tras 5 intentos.
        Errores: `pin_invalid` (422, con `attempts_left`), `pin_expired` / `pin_used` (410), `pin_locked` (423),
        `already_active` (409). La foto (JPG o PNG, máximo 5 MB) es obligatoria. También existe la página web `/activar`.
      operationId: activateAccount
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [email, pin, password, password_confirmation, photo]
              properties:
                email: { type: string, format: email }
                pin: { type: string, pattern: '^\d{6}$' }
                password: { type: string, minLength: 10 }
                password_confirmation: { type: string }
                photo: { type: string, format: binary }
      responses:
        '200': { description: 'Cuenta activa; ya puede iniciar sesión.' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { description: 'PIN vencido o ya usado.' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '423': { description: 'PIN anulado por intentos fallidos.' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /admin/communities/{id}/invitations:
    post:
      tags: [Superadministrador]
      summary: Alta por correo de un administrador o cobrador
      description: La cuenta queda pendiente y le llega un PIN para activarla. Si el correo ya estaba pendiente, se reenvía un PIN nuevo.
      operationId: inviteCommunityUser
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                role: { type: string, enum: [administrador, cobrador] }
      responses:
        '201': { description: 'Persona dada de alta (pendiente) y correo enviado.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/communities/{id}/users:
    get:
      tags: [Superadministrador]
      summary: Personas de una comunidad (para elegir al nuevo administrador)
      operationId: listCommunityUsers
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: 'Nombre, teléfono, correo, rol y si está activa cada persona.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/communities/{id}/admin:
    post:
      tags: [Superadministrador]
      summary: Cambiar el administrador (pide el PIN de seguridad)
      description: |
        El administrador anterior deja de serlo: queda como cobrador desactivado (`previous: deactivate`,
        por defecto) o como cobrador activo (`previous: cobrador`). Queda en la bitácora de la comunidad.
        PIN incorrecto → 422 `pin_invalid` (con `attempts_left`); demasiados → 423 `pin_locked`;
        sin PIN creado → 409 `pin_not_set`.
      operationId: changeCommunityAdmin
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, pin]
              properties:
                user_id: { type: string, format: uuid }
                pin: { type: string, pattern: '^\d{6}$' }
                previous: { type: string, enum: [deactivate, cobrador] }
      responses:
        '200': { description: Administrador cambiado. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '423': { description: PIN bloqueado por intentos fallidos. }
  /admin/communities/{id}/deactivate:
    post:
      tags: [Superadministrador]
      summary: Desactivar comunidad (nadie de ella entra ni sincroniza)
      operationId: deactivateCommunity
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: 'Comunidad desactivada; sus sesiones abiertas se cierran.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/communities/{id}/activate:
    post:
      tags: [Superadministrador]
      summary: Volver a activar una comunidad
      operationId: activateCommunity
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Comunidad activa. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/security-pin:
    get:
      tags: [Superadministrador]
      summary: ¿Ya tiene PIN de seguridad?
      operationId: securityPinStatus
      responses:
        '200': { description: '`{ is_set: bool }`' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Superadministrador]
      summary: Crear o cambiar el PIN de seguridad (pide la contraseña)
      operationId: setSecurityPin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, pin, pin_confirmation]
              properties:
                password: { type: string }
                pin: { type: string, pattern: '^\d{6}$' }
                pin_confirmation: { type: string }
      responses:
        '200': { description: 'PIN guardado (con hash).' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT HS256 obtenido en `POST /auth/login`. Enviar `Authorization: Bearer <token>`.'

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PadronEntity:
      name: entity
      in: path
      required: true
      schema: { type: string, enum: [viviendas, familias, habitantes] }

  responses:
    Unauthorized:
      description: Falta el JWT, es inválido, venció o la sesión se cerró.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: unauthenticated, message: Se requiere iniciar sesión. } }
    Forbidden:
      description: Sin permiso para la acción (o cuenta/comunidad desactivada).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: forbidden, message: No tiene permiso para esta acción. } }
    NotFound:
      description: No existe o es de otra comunidad.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: not_found, message: Recurso no encontrado. } }
    Conflict:
      description: Choca con el estado actual (ya pagado, ya anulado, domicilio con familia, etc.).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Datos inválidos; `details` trae los errores por campo.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: validation_error, message: 'Revisa los datos: hay campos con errores.', details: { email: [El campo correo es obligatorio.] } } }
    TooManyRequests:
      description: Límite de peticiones excedido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: forbidden }
            message: { type: string }
            details: { type: object, additionalProperties: true }
    Notice:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
    WithNotices:
      type: object
      properties:
        data: { type: object, additionalProperties: true }
        notices:
          type: array
          items: { $ref: '#/components/schemas/Notice' }
    Paginated:
      type: object
      properties:
        data: { type: array, items: {} }
        meta:
          type: object
          properties:
            page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            last_page: { type: integer }
            message: { type: [string, 'null'] }
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        app: { type: string }
        api_version: { type: string }
        time: { type: string, format: date-time }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, fail] }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, maxLength: 190, example: admin@sanisidro.test }
        password: { type: string, format: password, maxLength: 255 }
        device_id: { type: [string, 'null'], format: uuid, description: Equipo de escritorio desde el que se entra. }
        two_factor_code:
          type: [string, 'null']
          description: |
            Código de 6 números que llegó al correo. Solo el administrador, y solo la primera vez que entra en un
            equipo: sin él la respuesta es `403 two_factor_required` (con `email_hint`) y se envía el correo.
    TokenResponse:
      type: object
      required: [token, token_type, expires_at, idle_timeout_minutes, user]
      properties:
        token: { type: string, description: JWT HS256 (header.payload.firma), example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIuLi4ifQ.firma }
        token_type: { type: string, const: Bearer }
        expires_at: { type: string, format: date-time }
        idle_timeout_minutes: { type: integer, example: 30 }
        user: { $ref: '#/components/schemas/AuthUser' }
    AuthUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        roles: { type: array, items: { type: string } }
        panel: { type: [string, 'null'], enum: [superadministrador, administrador, cobrador, habitante, publico, null] }
        community:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        receipt_prefix: { type: string, example: E01 }
        is_active: { type: boolean }
        community_id: { type: string, format: uuid }
    Mutation:
      type: object
      required: [mutation_id, entity, entity_id, op, payload]
      properties:
        mutation_id: { type: string, format: uuid, description: Llave de idempotencia. }
        entity: { type: string, example: pagos }
        entity_id: { type: string, format: uuid }
        op: { type: string, enum: [create, update, delete, void] }
        payload: { type: object, additionalProperties: true }
        occurred_at: { type: [string, 'null'], format: date-time }
    MutationResult:
      type: object
      properties:
        mutation_id: { type: string, format: uuid }
        status: { type: string, enum: [accepted, rejected] }
        code: { type: string }
        message: { type: string }
        notices: { type: array, items: { $ref: '#/components/schemas/Notice' } }
    Change:
      type: object
      properties:
        cursor: { type: integer }
        entity: { type: string }
