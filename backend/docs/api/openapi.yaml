      operationId: myViviendas
      responses:
        '200':
          description: Viviendas con sus familias.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Vivienda' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /cobranza/buscar:
    get:
      tags: [Cobranza]
      summary: Buscar domicilio y ver lo que debe cada familia
      description: El administrador ve todas las viviendas; el cobrador solo las asignadas.
      operationId: searchCobranza
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Viviendas con adeudo por familia.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            label: { type: string }
                            familias:
                              type: array
                              items:
                                type: object
                                properties:
                                  id: { type: string, format: uuid }
                                  name: { type: string }
                                  owed_cents: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /cobranza/familias/{id}:
    get:
      tags: [Cobranza]
      summary: Cuadrícula de cobro de una familia
      operationId: estadoCobranza
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Cada cuota y multa con su estado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CargoEstado' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /pagos:
    get:
      tags: [Cobranza]
      summary: Recibos (el cobrador ve solo los suyos)
      operationId: listPagos
      parameters:
        - { name: familia_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Página de recibos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Pago' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Cobranza]
      summary: Cobrar meses o multas (completos) y emitir folio
      description: |
        Transacción con `SELECT … FOR UPDATE` sobre los cargos y candado consultivo para el folio. Si dos
        peticiones cobran el mismo cargo a la vez, una recibe `201` y la otra `409 already_paid`.
      operationId: createPago
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [familia_id, cargo_ids]
              properties:
                familia_id: { type: string, format: uuid }
                cargo_ids: { type: array, maxItems: 200, items: { type: string, format: uuid } }
                advance:
                  type: array
                  maxItems: 24
                  description: Meses por adelantado.
                  items:
                    type: object
                    required: [year, month]
                    properties:
                      year: { type: integer }
                      month: { type: integer }
      responses:
        '201':
          description: Pago registrado.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Pago' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Cargo ya pagado (`already_paid`) o anulado (`cargo_voided`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: already_paid, message: Cuota de noviembre 2026 ya se pagó con el folio W-000001. } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /ingresos/categorias:
