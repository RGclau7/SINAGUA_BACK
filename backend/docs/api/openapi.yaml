  /asignaciones:
    get:
      tags: [Cobradores]
      summary: Asignaciones vivienda → cobrador
      operationId: listAsignaciones
      parameters:
        - { name: cobrador_id, in: query, schema: { type: string, format: uuid } }
        - { name: vivienda_id, in: query, schema: { type: string, format: uuid } }
        - { name: historial, in: query, schema: { type: boolean }, description: Incluir las terminadas. }
      responses:
        '200':
          description: Asignaciones.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Asignacion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Cobradores]
      summary: Asignar viviendas a un cobrador
      description: Una vivienda tiene un solo cobrador a la vez (la asignación vigente se toma con `FOR UPDATE`).
      operationId: createAsignaciones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cobrador_id, vivienda_ids]
              properties:
                cobrador_id: { type: string, format: uuid }
                vivienda_ids: { type: array, minItems: 1, maxItems: 500, items: { type: string, format: uuid } }
      responses:
        '201':
          description: Asignaciones creadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Asignacion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /asignaciones/reasignar:
    post:
      tags: [Cobradores]
      summary: Pasar todas las viviendas de un cobrador a otro
      operationId: reassignAsignaciones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_cobrador_id, to_cobrador_id]
              properties:
                from_cobrador_id: { type: string, format: uuid }
                to_cobrador_id: { type: string, format: uuid }
      responses:
        '200':
          description: Viviendas reasignadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WithNotices' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /asignaciones/{id}/end:
    post:
      tags: [Cobradores]
      summary: Terminar una asignación
      operationId: endAsignacion
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Asignación terminada.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Asignacion' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
