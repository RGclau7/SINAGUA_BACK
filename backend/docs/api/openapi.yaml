      operationId: listFondos
      responses:
        '200':
          description: Fondos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Fondo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /gastos:
    get:
      tags: [Ingresos y gastos]
      summary: Gastos
      operationId: listGastos
      parameters:
        - { name: fondo, in: query, schema: { type: string }, description: '`cuotas` o id de categoría.' }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Gastos, el más reciente primero (máximo 500).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Gasto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Ingresos y gastos]
      summary: Registrar gasto (sale de un fondo)
      operationId: createGasto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concepto, amount_cents, spent_on]
              properties:
                fondo_id: { type: [string, 'null'], format: uuid, description: null = fondo de cuotas del agua. }
                concepto: { type: string, minLength: 3, maxLength: 160, example: Cambio de bomba }
                amount_cents: { type: integer, minimum: 1, example: 250000 }
                spent_on: { type: string, format: date }
                note: { type: [string, 'null'], maxLength: 255 }
      responses:
        '201':
          description: Gasto registrado (avisa si el fondo queda en negativo).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WithNotices' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

