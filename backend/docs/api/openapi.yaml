openapi: 3.1.0
info:
  title: SINAGUA API
  version: 1.0.0
  summary: Gestión del pozo de agua comunitario (padrón, cuotas, cobranza, gastos y bitácora).
  description: |
    API REST del sistema **SINAGUA**. La usan la app de escritorio (que trabaja sin internet y
    sincroniza con `/sync`) y los clientes en línea (web y móvil).

    ## Autenticación (JWT)
    1. `POST /auth/login` con correo y contraseña devuelve un **JWT firmado con HS256**.
    2. Cada petición protegida envía `Authorization: Bearer <token>`.
    3. El token vence a las **12 horas** (`exp`) o tras **30 minutos sin usarse**; `POST /auth/refresh`
       lo cambia por uno nuevo y `POST /auth/logout` lo revoca al instante.

    Claims del token: `iss`, `aud` (`sinagua-api`), `sub` (id del usuario), `jti` (id de la sesión en
    el servidor), `iat`, `nbf`, `exp`, `cid` (comunidad), `did` (equipo) y `roles`. Los roles del token
    son informativos: **los permisos siempre se revisan en el servidor** en cada petición.

    Las contraseñas se guardan con **bcrypt** (costo 12) y se re-cifran solas si se guardaron con un
    costo menor. Tras 5 intentos fallidos la cuenta se bloquea 15 minutos (`423`).

    ## Formato de respuestas
    - Éxito: `{ "data": ... }` (las listas paginadas agregan `meta`; algunas operaciones agregan `notices`).
    - Error: `{ "error": { "code": "...", "message": "...", "details": { ... } } }`. El `message` está en
      español sencillo para mostrarse tal cual al usuario.

    ## Dinero
    Todos los montos van en **centavos** (enteros) para evitar errores de redondeo: `15000` = $150.00.

    ## Comunidades
    Cada usuario pertenece a una comunidad y solo ve los datos de ella (filtro en la aplicación y
    Row-Level Security en PostgreSQL). El superadministrador no pertenece a ninguna y solo da de alta comunidades.

    ## Concurrencia
    Los cobros, entregas y asignaciones se registran en transacciones con `SELECT … FOR UPDATE` y
    candados consultivos de PostgreSQL: si dos equipos cobran el mismo mes a la vez, uno recibe `201` y
    el otro `409 already_paid`; nunca hay cobros dobles ni folios repetidos.
  contact:
    name: Equipo SINAGUA (ITSES)
  license:
    name: Uso académico
servers:
  - url: http://localhost:8081/api/v1
    description: Desarrollo (Docker)
  - url: 'http://{servidor}:{puerto}/api/v1'
    description: Servidor de la comunidad en la red local
    variables:
      servidor:
        default: 192.168.1.10
      puerto:
        default: '8081'
security:
  - bearerAuth: []
tags:
  - name: Sistema
    description: Estado del servicio.
  - name: Autenticación
    description: Inicio de sesión con JWT, renovación y cierre.
  - name: Equipos y sincronización
    description: Registro de equipos de escritorio y sincronización sin conexión (outbox).
  - name: Bitácora
    description: Registro inmutable con cadena de huellas SHA-256.
  - name: Movimientos
    description: Anulación (nunca se borran ni editan movimientos de dinero).
  - name: Padrón
    description: Viviendas, familias y habitantes.
  - name: Ajustes
    description: Cómo cobra la comunidad (cuota, días de pago, multas, paquetes).
  - name: Cuotas y multas
    description: Cuota por mes, generación de cargos y multas.
  - name: Cobradores
    description: Asignación de viviendas a cobradores.
  - name: Cobranza
    description: Búsqueda, estado de cuenta y pagos con folio.
  - name: Ingresos y gastos
    description: Fondos, ingresos extras y gastos con comprobante.
  - name: Entregas y cortes
    description: Dinero que cada cobrador entrega a tesorería.
  - name: Usuarios
    description: Usuarios y roles de la comunidad.
  - name: Superadministrador
    description: Alta de comunidades.

paths:
  /health:
    get:
      tags: [Sistema]
      summary: Estado del servicio
      operationId: health
      security: []
      responses:
        '200':
          description: Servicio y base de datos en línea.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Health'
              example:
                data: { status: ok, app: SINAGUA, api_version: v1, time: '2026-11-08T10:00:00-06:00', checks: { database: ok } }
        '503':
          description: La base de datos no responde (`status` = `degraded`).

  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión y obtener un JWT
      description: |
        Correo inexistente y contraseña incorrecta responden igual (`401 invalid_credentials`) para no revelar
        qué correos existen. Tras 5 fallos la cuenta se bloquea 15 minutos. Además hay un límite de 30
        intentos por minuto por IP (`429`).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example: { email: admin@sanisidro.test, password: prueba12345 }
      responses:
        '200':
          description: Sesión iniciada.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Correo o contraseña incorrectos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: invalid_credentials, message: Correo o contraseña incorrectos. } }
        '403':
          description: |
            Cuenta, comunidad o equipo desactivados (`account_inactive`, `community_inactive`, `device_inactive`),
            cuenta pendiente de activar (`account_pending`) o falta el código del correo (`two_factor_required`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '423':
          description: Cuenta bloqueada por intentos fallidos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: account_locked, message: Demasiados intentos fallidos. Intente de nuevo en 15 min., details: { retry_after_seconds: 900 } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/me:
    get:
      tags: [Autenticación]
      summary: Usuario de la sesión actual
      operationId: me
      responses:
        '200':
          description: Datos y rol vigentes del usuario.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AuthUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/refresh:
    post:
      tags: [Autenticación]
      summary: Renovar el JWT (rotación)
      description: Entrega un JWT nuevo y revoca el anterior; el token viejo deja de servir de inmediato.
      operationId: refresh
      responses:
        '200':
          description: Token nuevo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar sesión
      description: Revoca la sesión del JWT enviado. Queda registrado en la bitácora.
      operationId: logout
      responses:
        '200':
          description: Sesión cerrada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      logged_out: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /devices:
    post:
      tags: [Equipos y sincronización]
      summary: Registrar un equipo de escritorio
      description: Idempotente por `id`. Asigna al equipo su prefijo de folio (E01, E02, …).
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id: { type: string, format: uuid }
                name: { type: string, maxLength: 120, example: Caja de la tesorería }
      responses:
        '200':
          description: El equipo ya estaba registrado.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Device' } }
        '201':
          description: Equipo registrado.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Device' } }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /sync/push:
    post:
      tags: [Equipos y sincronización]
      summary: Subir los cambios hechos sin conexión
      description: |
        Recibe la cola de salida (outbox) del equipo, hasta 500 mutaciones. Cada mutación es idempotente por
        `mutation_id`: si el equipo reintenta por un corte de red, no se aplica dos veces.
      operationId: syncPush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, mutations]
              properties:
                device_id: { type: string, format: uuid }
                mutations:
                  type: array
                  maxItems: 500
                  items: { $ref: '#/components/schemas/Mutation' }
      responses:
        '200':
          description: Resultado por mutación.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      results:
                        type: array
                        items: { $ref: '#/components/schemas/MutationResult' }
                      server_time: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /sync/pull:
    get:
      tags: [Equipos y sincronización]
      summary: Bajar los cambios de la comunidad
      operationId: syncPull
      parameters:
        - { name: device_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: integer, minimum: 0 }, description: Último cursor recibido. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 500 } }
      responses:
        '200':
          description: Cambios posteriores al cursor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      changes:
                        type: array
                        items: { $ref: '#/components/schemas/Change' }
                      next_cursor: { type: integer }
                      has_more: { type: boolean }
                      scope: { type: string }
                      server_time: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /audit-logs:
    get:
      tags: [Bitácora]
      summary: Consultar la bitácora
      description: Requiere el permiso `bitacora.consultar`. 20 registros por página.
      operationId: listAuditLogs
      parameters:
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: category, in: query, schema: { type: string } }
        - { name: entity, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Página de registros.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AuditLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /audit-logs/verify:
    get:
      tags: [Bitácora]
      summary: Verificar la cadena de huellas (en la petición)
      operationId: verifyAuditLogs
      responses:
        '200':
          description: Resultado de la verificación.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/ChainResult' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /audit-logs/verify-async:
    post:
      tags: [Bitácora]
      summary: Pedir la verificación en segundo plano (cola)
      description: |
        Responde `202` al instante y un worker de la cola (`php artisan queue:work`) recorre la bitácora por bloques.
        Pedirla varias veces seguidas deja **un solo trabajo** por comunidad (`ShouldBeUnique`) y dos workers
        nunca verifican la misma comunidad a la vez (`WithoutOverlapping`).
      operationId: verifyAuditLogsAsync
      responses:
        '202':
          description: Trabajo en cola.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: { status: { type: string, const: queued } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Bitácora]
      summary: Resultado de la última verificación en segundo plano
      operationId: verifyAuditLogsStatus
      responses:
        '200':
          description: '`none` (nunca se pidió), `queued` (en cola) o `done` (con el resultado).'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - type: object
                        properties:
                          status: { type: string, enum: [none, queued, done] }
                          queued_at: { type: string, format: date-time }
                          finished_at: { type: string, format: date-time }
                      - $ref: '#/components/schemas/ChainResult'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /movements/{entity}/{id}/void:
    post:
      tags: [Movimientos]
      summary: Anular un movimiento con motivo
      description: Requiere `movimientos.anular`. El movimiento queda anulado, no se borra (cargos, pagos, ingresos, gastos y entregas).
      operationId: voidMovement
      parameters:
        - name: entity
          in: path
          required: true
          schema: { type: string, enum: [cargos, pagos, ingresos, gastos, entregas] }
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, example: Se registró dos veces por error }
      responses:
        '200':
          description: Movimiento anulado.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /padron/registro:
    post:
      tags: [Padrón]
      summary: Registrar familia con su titular (y vivienda si hace falta)
      description: Si el domicilio ya tiene familias responde `409 address_has_family`; con `confirm_shared_address=true` la registra ahí.
      operationId: registerFamily
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vivienda_id: { type: string, format: uuid, description: Vivienda existente (o enviar `vivienda`). }
                vivienda: { $ref: '#/components/schemas/ViviendaInput' }
                familia:
                  type: object
                  properties:
                    name: { type: string, example: Familia López }
                    cuota_especial_cents: { type: [integer, 'null'] }
                titular: { $ref: '#/components/schemas/HabitanteInput' }
                confirm_shared_address: { type: boolean }
            example:
              vivienda: { address: Calle Hidalgo 12, neighborhood: Centro, paquete_id: p1 }
              familia: { name: Familia López }
              titular: { given_names: Ana, paternal_surname: López, phone: '7221234567' }
      responses:
        '201':
          description: Registrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      vivienda: { $ref: '#/components/schemas/Vivienda' }
                      familia: { $ref: '#/components/schemas/Familia' }
                      titular: { $ref: '#/components/schemas/Habitante' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /padron/{entity}:
    parameters:
      - $ref: '#/components/parameters/PadronEntity'
    get:
      tags: [Padrón]
      summary: Buscar en el padrón (20 por página)
      operationId: listPadron
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [activos, baja, todos], default: activos } }
        - { name: vivienda_id, in: query, schema: { type: string, format: uuid } }
        - { name: familia_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Página de resultados.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/Vivienda'
                            - $ref: '#/components/schemas/Familia'
                            - $ref: '#/components/schemas/Habitante'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Padrón]
      summary: Crear vivienda, familia o habitante
      operationId: createPadron
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ViviendaInput'
                - $ref: '#/components/schemas/FamiliaInput'
                - $ref: '#/components/schemas/HabitanteInput'
      responses:
        '201':
          description: Creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/Vivienda'
                      - $ref: '#/components/schemas/Familia'
                      - $ref: '#/components/schemas/Habitante'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /padron/{entity}/{id}:
    parameters:
      - $ref: '#/components/parameters/PadronEntity'
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Padrón]
      summary: Detalle (con familias o habitantes)
      operationId: showPadron
      responses:
        '200':
          description: Registro.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Padrón]
      summary: Editar
      operationId: updatePadron
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ViviendaInput'
                - $ref: '#/components/schemas/FamiliaInput'
                - $ref: '#/components/schemas/HabitanteInput'
      responses:
        '200':
          description: Actualizado.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /padron/{entity}/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/PadronEntity'
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Padrón]
      summary: Dar de baja (baja lógica en cascada)
      description: Con adeudo responde `409 has_debt`; con `confirm_debt=true` la hace y el adeudo se conserva.
      operationId: deactivatePadron
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
                confirm_debt: { type: boolean }
      responses:
        '200':
          description: Dado de baja.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WithNotices' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /padron/{entity}/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/PadronEntity'
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Padrón]
      summary: Reactivar
      operationId: activatePadron
      responses:
        '200':
          description: Reactivado.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /ajustes:
    get:
      tags: [Ajustes]
      summary: Cómo cobra la comunidad
      operationId: showAjustes
      responses:
        '200':
          description: Ajustes vigentes.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/Ajustes' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Ajustes]
      summary: Cambiar los ajustes de cobro (administrador)
      operationId: updateAjustes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cuota_cents: { type: [integer, 'null'], minimum: 1 }
                periodicidad_meses: { type: integer }
                dias_pago: { type: array, items: { type: integer, minimum: 1, maximum: 31 } }
                cobro_fuera_de_dias: { type: boolean }
                multa_cents: { type: integer, minimum: 0 }
                meses_adelanto: { type: integer, minimum: 0, maximum: 12 }
                paquetes:
                  type: array
                  items: { $ref: '#/components/schemas/Paquete' }
      responses:
        '200':
          description: Ajustes guardados.
          content:
            application/json:
              schema:
                type: object
